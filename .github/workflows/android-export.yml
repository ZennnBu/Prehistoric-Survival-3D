
name: Android APK Export

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK Packages
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "cmdline-tools;latest" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      - name: Create Debug Keystore
        run: |
          mkdir -p "$HOME/.android"

          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Configure Godot Android Paths
        run: |
          mkdir -p "$HOME/.config/godot"

          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/java_sdk_path = "%s"\nexport/android/android_sdk_path = "%s"\n' \
            "$JAVA_HOME" "$ANDROID_HOME" \
            > "$HOME/.config/godot/editor_settings-4.tres"

          cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Check Project
        run: |
          godot --headless --editor \
            --path . \
            --quit \
            --verbose

      - name: Export APK
        run: |
          mkdir -p build

          godot --headless \
            --path . \
            --export-debug "Android" \
            build/PrehistoricSurvival.apk \
            --verbose 2>&1 | tee build/export-log.txt

        shell: bash

      - name: Verify APK
        run: |
          if [ ! -f build/PrehistoricSurvival.apk ]; then
            echo "APK was not created by Godot."
            echo "Check the Export APK logs above."
            exit 1
          fi

          ls -lh build/PrehistoricSurvival.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prehistoric-Survival-Android
          path: build/PrehistoricSurvival.apk
          if-no-files-found: error
          
