
name: Android APK Export

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK Packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmake;3.10.2.4988404" "ndk;23.2.8568313"

      - name: Check Android Export Preset
        run: |
          if [ ! -f export_presets.cfg ]; then
            echo "Android export preset is missing."
            exit 1
          fi

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/PrehistoricSurvival.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Prehistoric-Survival-Android
          path: build/PrehistoricSurvival.apk
          
